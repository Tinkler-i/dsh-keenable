# The layer this bundle contributes when a profile lists it.
#
# Both providers register under the id `keenable`, one per capability registry.
# The built-in DeepSeek search provider and the local HTTP fetch provider stay
# mounted, so both ids are pinned: with two usable providers and no pin, the
# seam fails with WEB_PROVIDER_AMBIGUOUS instead of picking one. A config patch
# replaces the row's config object, so both fields are stated.
#
# To keep the local HTTP fetch provider, set fetchProvider back to `http`.
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: keenable
    fetchProvider: keenable

- insert:
    - id: keenable
      name: '@keenable/dsh-keenable'
