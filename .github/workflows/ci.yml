name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '24']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Offline: mocked API, real Harness seam and tools. The live suite is left
      # out so CI never depends on the shared keyless limit.
      - run: npm test
      - name: Package contents
        run: npm pack --dry-run 2>&1 | tee /dev/stderr | grep -q 'cordis.patch.yml'
